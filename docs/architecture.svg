<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="900" height="420" rx="12" fill="#ffffff"/>

  <!-- Discord -->
  <rect x="30" y="60" width="160" height="320" rx="10" fill="#eef0fe" stroke="#5865F2" stroke-width="2"/>
  <text x="110" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#5865F2">Discord</text>
  <text x="110" y="200" text-anchor="middle" font-size="13" fill="#1f2937">User types</text>
  <text x="110" y="220" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f2937">/posts</text>
  <text x="110" y="240" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f2937">/sources</text>
  <text x="110" y="260" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f2937">/usage</text>

  <!-- Worker container -->
  <rect x="260" y="30" width="380" height="365" rx="10" fill="#fff7ed" stroke="#F38020" stroke-width="2"/>
  <text x="450" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#c2410c">Cloudflare Worker</text>

  <g font-size="13" fill="#1f2937">
    <rect x="290" y="72" width="320" height="44" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="450" y="99" text-anchor="middle">1. Verify Ed25519 signature</text>

    <rect x="290" y="132" width="320" height="44" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="450" y="151" text-anchor="middle">2. Dispatch interaction</text>
    <text x="450" y="168" text-anchor="middle" font-size="11" fill="#6b7280">autocomplete, /sources, /usage reply instantly</text>

    <rect x="290" y="192" width="320" height="44" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="450" y="211" text-anchor="middle">3. /posts: deferred reply</text>
    <text x="450" y="228" text-anchor="middle" font-size="11" fill="#6b7280">work continues in ctx.waitUntil()</text>

    <rect x="290" y="252" width="320" height="44" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="450" y="271" text-anchor="middle">4. Fetch + parse RSS/Atom</text>
    <text x="450" y="288" text-anchor="middle" font-size="11" fill="#6b7280">latest N, or random sample of newest 50</text>

    <rect x="290" y="312" width="320" height="44" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="450" y="331" text-anchor="middle">5. Build embeds</text>
    <text x="450" y="348" text-anchor="middle" font-size="11" fill="#6b7280">max 10 per message</text>
  </g>

  <g stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="450" y1="116" x2="450" y2="130"/>
    <line x1="450" y1="176" x2="450" y2="190"/>
    <line x1="450" y1="236" x2="450" y2="250"/>
    <line x1="450" y1="296" x2="450" y2="310"/>
  </g>

  <!-- Discord <-> Worker -->
  <g stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="190" y1="94" x2="288" y2="94"/>
    <line x1="290" y1="214" x2="192" y2="214"/>
    <line x1="290" y1="334" x2="192" y2="334"/>
  </g>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="225" y="86">HTTP POST</text>
    <text x="225" y="206">deferred</text>
    <text x="225" y="326">follow-up</text>
    <text x="225" y="352">webhook</text>
  </g>

  <!-- External services -->
  <rect x="690" y="110" width="180" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="780" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">Workers KV</text>
  <text x="780" y="154" text-anchor="middle" font-size="11" fill="#065f46">daily /posts counter</text>

  <rect x="690" y="215" width="180" height="50" rx="8" fill="#fff1f0" stroke="#FF4500" stroke-width="1.6"/>
  <text x="780" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">Reddit</text>
  <text x="780" y="253" text-anchor="middle" font-size="11" fill="#b91c1c">RSS, or API if logged in</text>

  <rect x="690" y="285" width="180" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
  <text x="780" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Blogs</text>
  <text x="780" y="323" text-anchor="middle" font-size="11" fill="#374151">any RSS / Atom feed</text>

  <g stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="610" y1="154" x2="688" y2="142"/>
    <line x1="610" y1="268" x2="688" y2="242"/>
    <line x1="610" y1="282" x2="688" y2="308"/>
  </g>
  <text x="780" y="365" text-anchor="middle" font-size="11" fill="#6b7280">feed fetches edge-cached 60s</text>
</svg>
